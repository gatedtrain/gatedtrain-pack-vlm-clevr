# Run the pack's CPU tests on every push and pull request. The end-to-end test drives gatedtrain's own test harness
# (not in the wheel), so gatedtrain's source is checked out at the release the pack is tested with; the recipe is
# checked out for the tests that compare the pack's training script and runtime with it. No GPU, Docker or models.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gatedtrain/gatedtrain
          ref: v0.7.0
          path: _deps/gatedtrain
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gatedtrain/gatedtrain-recipe-nemo-rl-vlm-clevr
          path: _deps/recipe
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[convert]" "gatedtrain==0.7.0"
      # The end-to-end test starts a keeper, which refuses to start when a file it runs, or a directory above one, is
      # writable by another uid. The runner user clears those bits on the toolcache Python and the checkout; the
      # directories above the toolcache Python ship world-writable, so this one step clears them with sudo. The check
      # after it fails the job early with what is still open.
      - run: chmod -R go-w "$pythonLocation" "$GITHUB_WORKSPACE"
      - run: |
          d="$pythonLocation"
          while [ "$d" != / ]; do d="$(dirname "$d")"; sudo chmod go-w "$d"; done
      - run: >-
          python -c "import os, sys; from gatedtrain.ainative.keeper import envcheck as e;
          ps = e.path_problems(e.keeper_code_paths(), os.getuid()); [print(p.line()) for p in ps[:20]];
          sys.exit(1 if ps else 0)"
      - run: id
      # GATEDTRAIN_REQUIRE_CONTAINER_USER: the end-to-end test fails, rather than skips, when the runner user cannot
      # launch the fake backend's containers.
      - run: python -m unittest discover -s tests -t tests -v
        env:
          GATEDTRAIN_REQUIRE_CONTAINER_USER: "1"
          GATEDTRAIN_SRC: ${{ github.workspace }}/_deps/gatedtrain
          GATEDTRAIN_RECIPE_VLM_CLEVR_DIR: ${{ github.workspace }}/_deps/recipe
